# https://help.github.com/en/categories/automating-your-workflow-with-github-actions
#
# Reusable: this workflow can be called from consumer repos via `workflow_call`.
# Runs zizmor (https://docs.zizmor.sh/) against .github/workflows/ to flag
# CI security issues. Findings at or above `inputs.min_severity` fail the check.
name: "Zizmor"

on: # yamllint disable-line rule:truthy
    workflow_dispatch: # yamllint disable-line rule:empty-values
    # Runs on every PR so it can be wired up as a required status check.
    # Path-filtered triggers are skipped — and "skipped" required checks block merges.
    pull_request:
        types: ["opened", "synchronize", "reopened"]
        branches: ["main"]
    push:
        branches: ["main"]
    workflow_call:
        inputs:
            min_severity:
                description: "Minimum severity to fail on (informational | low | medium | high)."
                required: false
                type: "string"
                default: "medium"

concurrency:
    group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}"
    cancel-in-progress: true

permissions: {}

jobs:
    zizmor:
        name: "Zizmor"
        runs-on: "ubuntu-latest"
        timeout-minutes: 30
        permissions:
            # `actions/checkout` needs this. Omitting it works on a PUBLIC repo,
            # where an unauthenticated clone succeeds anyway — but on a private
            # one git reports the repo as absent:
            #   fatal: repository 'https://github.com/<owner>/<repo>/' not found
            # which reads as a wrong URL rather than a missing scope. `zizmor`
            # then produces no `results.sarif` and the upload step fails too.
            contents: "read"
            security-events: "write"
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a" # v2.22.4
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  persist-credentials: false

            - name: "Install zizmor"
              uses: "taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39" # v2.90.3
              with:
                  tool: "zizmor"

            # Two invocations, because one cannot do both jobs:
            #   --format sarif exits 0 regardless of findings (SARIF is meant to be
            #   uploaded, not to gate), and `cmd > file` / `cmd | tee file` both
            #   discard the exit code unless `pipefail` is set.
            # The plain run supplies the gate; the SARIF run supplies the upload.
            - name: "Run zizmor"
              env:
                  GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
                  MIN_SEVERITY: "${{ inputs.min_severity || 'medium' }}"
              shell: "bash"
              run: |
                  set -o pipefail
                  zizmor --min-severity "$MIN_SEVERITY" --format plain . | tee zizmor.log

            - name: "Generate SARIF report"
              if: "always()"
              env:
                  GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
                  MIN_SEVERITY: "${{ inputs.min_severity || 'medium' }}"
              run: "zizmor --min-severity \"$MIN_SEVERITY\" --format sarif . > results.sarif"

            - name: "Upload SARIF file"
              if: "always()"
              uses: "github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066" # v4.39.3
              with:
                  sarif_file: "results.sarif"
                  category: "zizmor"
