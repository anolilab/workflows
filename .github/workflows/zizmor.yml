# https://help.github.com/en/categories/automating-your-workflow-with-github-actions
#
# Reusable: this workflow can be called from consumer repos via `workflow_call`.
# Runs zizmor (https://docs.zizmor.sh/) against .github/workflows/ to flag
# CI security issues. Findings at or above `inputs.min_severity` fail the check.
name: "Zizmor"

on: # yamllint disable-line rule:truthy
    workflow_dispatch: # yamllint disable-line rule:empty-values
    # Runs on every PR so it can be wired up as a required status check.
    # Path-filtered triggers are skipped — and "skipped" required checks block merges.
    pull_request:
        types: ["opened", "synchronize", "reopened"]
        branches: ["main"]
    push:
        branches: ["main"]
    workflow_call:
        inputs:
            min_severity:
                description: "Minimum severity to fail on (informational | low | medium | high)."
                required: false
                type: "string"
                default: "medium"

concurrency:
    group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}"
    cancel-in-progress: true

permissions: {}

jobs:
    zizmor:
        name: "Zizmor"
        runs-on: "ubuntu-latest"
        timeout-minutes: 30
        permissions:
            # `actions/checkout` needs this. Omitting it works on a PUBLIC repo,
            # where an unauthenticated clone succeeds anyway — but on a private
            # one git reports the repo as absent:
            #   fatal: repository 'https://github.com/<owner>/<repo>/' not found
            # which reads as a wrong URL rather than a missing scope. `zizmor`
            # then produces no `results.sarif` and the upload step fails too.
            contents: "read"
            security-events: "write"
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c" # v2.21.0
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  persist-credentials: false

            - name: "Install zizmor"
              uses: "taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1" # v2.85.13
              with:
                  tool: "zizmor"

            # `tee` keeps the exit code from zizmor (vs `>` which always returns 0),
            # so a finding at or above --min-severity fails the PR check.
            - name: "Run zizmor"
              env:
                  GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
                  MIN_SEVERITY: "${{ inputs.min_severity || 'medium' }}"
              run: "zizmor --min-severity \"$MIN_SEVERITY\" --format sarif . | tee results.sarif"

            - name: "Upload SARIF file"
              if: "always()"
              uses: "github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd" # v4.37.7
              with:
                  sarif_file: "results.sarif"
                  category: "zizmor"
