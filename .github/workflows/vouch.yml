# Note: this is a shared pipeline used by other repositories.
# Docs: https://docs.github.com/en/actions/using-workflows/reusing-workflows
#
# Labels a pull request with how far its author is trusted: `vouch:trusted`
# (collaborator, bot or listed in the vouched file), `vouch:unvouched` or
# `vouch:denounced`. It labels only; nothing is blocked.
#
# SECURITY: the CALLING workflow must trigger on `pull_request_target` (so it can
# label pull requests from forks) and MUST NOT check out the repository. This
# reusable workflow never checks out code, so no fork-controlled ref is ever
# executed. See the companion `vouch.md` for a caller example.

name: "Vouch"

on: # yamllint disable-line rule:truthy
    workflow_call:
        inputs:
            target-repo:
                description: "The repo to run this action on. This is to prevent actions from running on forks unless intended."
                required: true
                type: "string"
            vouched-file:
                description: "Path to the vouched contributors file in the calling repository."
                required: false
                type: "string"
                default: ".github/VOUCHED.td"

permissions:
    contents: "read"

jobs:
    vouch:
        name: "Vouch"
        if: "github.repository == inputs.target-repo"
        runs-on: "ubuntu-latest"
        timeout-minutes: 5
        permissions:
            contents: "read"
            issues: "write" # to create the labels
            pull-requests: "write" # to apply them
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25" # v2.22.1
              with:
                  egress-policy: "audit"

            # `check-user` treats a trust file it cannot fetch as an empty one and answers
            # `unknown`, which would replace a correct `vouch:trusted` with
            # `vouch:unvouched`. Fail before any label changes unless the file is
            # readable, or absent: a repository without a list has nobody vouched.
            - name: "Check the trust file is readable"
              uses: "actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3" # v9.0.0
              env:
                  VOUCHED_FILE: "${{ inputs.vouched-file }}"
              with:
                  script: |
                      try {
                          await github.rest.repos.getContent({ ...context.repo, path: process.env.VOUCHED_FILE });
                      } catch (error) {
                          if (error.status !== 404) throw error;
                          core.info(`${process.env.VOUCHED_FILE} does not exist; nobody is vouched.`);
                      }

            - name: "Check the PR author"
              id: "vouch"
              uses: "mitchellh/vouch/action/check-user@d66fa29a64600490892131ad87597c30c91fcac4" # v1
              with:
                  user: "${{ github.event.pull_request.user.login }}"
                  vouched-file: "${{ inputs.vouched-file }}"
                  allow-fail: true
              env:
                  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

            - name: "Sync the trust label"
              uses: "actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3" # v9.0.0
              env:
                  VOUCH_STATUS: "${{ steps.vouch.outputs.status }}"
              with:
                  script: |
                      const status = process.env.VOUCH_STATUS;
                      const labels = [
                          { name: "vouch:trusted", color: "1f883d", description: "PR author is a collaborator, a bot or on the VOUCHED list." },
                          { name: "vouch:unvouched", color: "fbca04", description: "PR author is not on the VOUCHED list yet." },
                          { name: "vouch:denounced", color: "d1242f", description: "PR author is explicitly blocked by the VOUCHED list." },
                      ];
                      const next =
                          status === "denounced"
                              ? "vouch:denounced"
                              : ["bot", "collaborator", "vouched"].includes(status)
                                ? "vouch:trusted"
                                : "vouch:unvouched";
                      const issue_number = context.payload.pull_request.number;
                      const { owner, repo } = context.repo;

                      for (const label of labels) {
                          try {
                              await github.rest.issues.createLabel({ owner, repo, ...label });
                          } catch (error) {
                              // 422: the label already exists.
                              if (error.status !== 422) throw error;
                          }
                      }

                      const { data: current } = await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number, per_page: 100 });

                      for (const { name } of current) {
                          if (name !== next && labels.some((label) => label.name === name)) {
                              await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
                          }
                      }

                      if (!current.some((label) => label.name === next)) {
                          await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [next] });
                      }

                      core.info(`PR #${issue_number}: ${status} -> ${next}`);
