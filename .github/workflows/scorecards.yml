# This workflow uses actions that are not certified by GitHub. They are provided
# by a third-party and are governed by separate terms of service, privacy
# policy, and support documentation.
#
# Reusable: this workflow can be called from consumer repos via `workflow_call`.
name: "Scorecard supply-chain security"

on: # yamllint disable-line rule:truthy
    workflow_call:
        inputs:
            branch:
                description: "Default branch to evaluate (informational; push trigger uses 'main' by default)."
                required: false
                type: "string"
                default: "main"
            publish_results:
                description: "Publish results to the OpenSSF REST API (public repos only)."
                required: false
                type: "boolean"
                default: true

permissions:
    contents: "read"

jobs:
    analysis:
        name: "Scorecard analysis"
        # Scorecard supports push and schedule on the default branch only: both
        # publish_results and the Branch-Protection check require it. Consumers list
        # every release branch they use in their push trigger (main, master, alpha,
        # beta), so drop the runs that come from a branch which is not the default
        # instead of letting them fail or publish nothing.
        if: "github.event_name != 'push' || github.ref_name == github.event.repository.default_branch"
        runs-on: "ubuntu-latest"
        timeout-minutes: 30
        permissions:
            # Needed to upload the results to code-scanning dashboard.
            security-events: "write"
            # Needed to publish results and get a badge (see publish_results below).
            id-token: "write"
            contents: "read"
            actions: "read"

        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25" # v2.22.1
              with:
                  egress-policy: "audit"

            - name: "Checkout code"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  persist-credentials: false

            - name: "Run analysis"
              uses: "ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e" # v2.5.0
              with:
                  results_file: "results.sarif"
                  results_format: "sarif"
                  # (Optional) "write" PAT token. Uncomment the `repo_token` line below if:
                  # - you want to enable the Branch-Protection check on a *public* repository, or
                  # - you are installing Scorecards on a *private* repository
                  # To create the PAT, follow the steps in https://github.com/ossf/scorecard-action#authentication-with-pat.
                  # repo_token: ${{ secrets.SCORECARD_TOKEN }}

                  # Public repositories:
                  #   - Publish results to OpenSSF REST API for easy access by consumers
                  #   - Allows the repository to include the Scorecard badge.
                  #   - See https://github.com/ossf/scorecard-action#publishing-results.
                  # For private repositories:
                  #   - `publish_results` will always be set to `false`, regardless
                  #     of the value entered here.
                  publish_results: "${{ inputs.publish_results == null && true || inputs.publish_results }}"

            # Upload the results as artifacts (optional). Commenting out will disable uploads of run results in SARIF
            # format to the repository Actions tab.
            - name: "Upload artifact"
              uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
              with:
                  name: "SARIF file"
                  path: "results.sarif"
                  retention-days: 5

            # Upload the results to GitHub's code scanning dashboard.
            - name: "Upload to code-scanning"
              uses: "github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d" # v4.38.3
              with:
                  sarif_file: "results.sarif"
