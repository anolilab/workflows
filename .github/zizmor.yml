# Zizmor static analyzer config.
# https://docs.zizmor.sh/configuration/
#
# checkout-with-retry's two artipacked findings are suppressed inline rather
# than here. They pass persist-credentials through a composite input whose
# declared default is "false", and zizmor cannot resolve composite input
# defaults, so it reads the pass-through as unset and assumes the
# actions/checkout default of true. This `rules:` form only accepts workflow
# filenames, not composite action paths, so it cannot express that case.

rules:
    dangerous-triggers:
        # require-allow-edits needs pull_request_target to read PR metadata with
        # write-on-parent permissions. No PR-controlled ref is checked out, so
        # the fork-takeover pattern that makes pull_request_target dangerous
        # doesn't apply here.
        ignore:
            - "require-allow-edits.yml"
